<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Father Translate</title>
<style>
body{background:linear-gradient(#004aad,#00c6ff);color:white;text-align:center;font-family:Arial;padding:20px}
.card{background:white;color:black;border-radius:20px;padding:15px;max-width:500px;margin:auto}
#text{width:80%;padding:15px;border-radius:12px;border:2px solid #ddd;font-size:16px}
button{padding:12px;margin:5px;border-radius:10px;border:none;background:#ff9800;color:white;font-weight:bold}
#output{background:#f5f5f5;padding:15px;border-radius:10px;margin-top:15px;font-size:18px;font-weight:bold;min-height:30px}
</style>
</head>
<body>
<h1>🌍 Father Translate 🇬🇭</h1>
<div class="card">
<select id="langFrom"><option value="auto">Auto Detect</option><option value="en">English</option><option value="ak">Twi</option><option value="ee">Ewe</option><option value="gaa">Ga</option><option value="ha">Hausa</option><option value="fr">French</option><option value="es">Spanish</option></select>
<select id="langTo"><option value="ak">Twi</option><option value="en">English</option><option value="ee">Ewe</option><option value="gaa">Ga</option><option value="ha">Hausa</option><option value="fr">French</option><option value="es">Spanish</option></select>
<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin:15px 0;">
<input id="text" placeholder="Type anything... Auto will detect!">
<button id="micBtn" style="font-size:22px;">🎤</button>
</div>
<button onclick="doTranslate()">🌐 Translate</button>
<button onclick="speakOut()">🔊 Speak</button>
<div id="output">Translation will appear here...</div>
<div id="status" style="font-size:12px;margin-top:10px;"></div>
</div>
<script>
let lastT="";
const textEl=document.getElementById('text');
const outEl=document.getElementById('output');
const stEl=document.getElementById('status');
const micBtn=document.getElementById('micBtn');
async function doTranslate(){
const t=textEl.value.trim();if(!t){stEl.innerText="Type first";return;}
const to=document.getElementById('langTo').value;
stEl.innerText="Translating...";
try{const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=en|${to}`);const d=await r.json();lastT=d.responseData.translatedText||t;outEl.innerText=lastT;stEl.innerText="Done ✅";}catch(e){outEl.innerText=t;stEl.innerText="Offline";}
}
function speakOut(){const t=lastT||textEl.value;if(!t)return;const u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u);}
let rec;
if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new SR();
rec.onstart=()=>{micBtn.innerText='🔴';stEl.innerText='Listening...';};
rec.onend=()=>{micBtn.innerText='🎤';};
rec.onresult=(e)=>{textEl.value=e.results[0][0].transcript;stEl.innerText='Heard: '+textEl.value;doTranslate();};
rec.onerror=(e)=>{stEl.innerText='Allow mic: '+e.error;micBtn.innerText='🎤';};
}
micBtn.onclick=()=>{if(!rec){alert('Use Chrome');return;}try{rec.start();}catch{rec.stop();setTimeout(()=>rec.start(),300);}};
</script>
</body>
                                                                                                                                                                                                                                  </html>
